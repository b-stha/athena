[build-system]
requires = ["setuptools>=66,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-ovos"
version = "0.1.0"
description = "Pi-hosted voice agent using cloud reasoning and Home Assistant/Windows MCP tools"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
agent = ["mcp==1.26.0", "httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]
wake = ["openwakeword==0.6.0", "numpy==1.26.4", "onnxruntime==1.20.1",
        "tflite-runtime==2.14.0; platform_system == 'Linux'"]

[project.entry-points."opm.skill"]
athena-skill = "athena_skill:AthenaSkill"

[project.entry-points."opm.microphone"]
athena-microphone = "athena_ovos.plugins:AthenaMicrophone"

[project.entry-points."opm.stt"]
athena-wyoming-whisper = "athena_ovos.plugins:AthenaWhisperSTT"

# WebRTC VAD 0.0.1 still advertises the old ovos.plugin.VAD group.
[project.entry-points."opm.VAD"]
athena-webrtcvad = "ovos_vad_plugin_webrtcvad:WebRTCVAD"

# Precise ONNX 0.1.0 advertises the old mycroft.plugin.wake_word group.
[project.entry-points."opm.wake_word"]
athena-precise-onnx = "athena_ovos.wake:AthenaPreciseWakeWord"
athena-openwakeword = "athena_ovos.custom_wake:AthenaOpenWakeWord"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["router", "resolver"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["athena_ovos*", "athena_skill*", "athena_wake*", "athena_agent*", "integrations*"]
exclude = ["tools*", "tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
